name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/validate-skills.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-skills-ref
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install skills-ref
        run: pip install git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref

      - name: Validate all skills
        run: |
          failed=0
          for skill_dir in skills/*/; do
            # Skip hidden directories
            if [[ "$(basename "$skill_dir")" == .* ]]; then
              continue
            fi
            echo "Validating: $skill_dir"
            if ! skills-ref validate "$skill_dir"; then
              failed=1
            fi
          done
          exit $failed

  quant-regression-gate:
    name: Quant regression gate
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: skills/quantitative-backtesting
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quant-${{ hashFiles('skills/quantitative-backtesting/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-quant-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast deterministic quant regression subset
        env:
          PYTHONPATH: scripts
        run: |
          python3 -m pytest tests/test_romano_wolf_stepdown.py tests/test_reality_check.py tests/test_reality_check_family_example.py -q
          python3 -m pytest tests/test_walk_forward.py -k "family or main_registers" -q
