[pytest]
# Long-running integration suites (walk-forward methodology tests) require
# extended timeouts. The following tests are documented in tests/README.md:
# - test_walk_forward.py: ~8 min (≈468 s), 235+ tests
# - test_walk_forward_cross_sectional_momentum_protocol_sensitivity_real_triple.py: ~6 min (≈360 s), 5 tests
# - test_resolution_vs_sample_size.py: ~13 min total (≈765 s), 79 tests; heaviest
#   single test ~3 min (≈174 s) in baseline env; 1200 s allows margin for CI.
# Set a generous timeout to allow these to complete without being killed.
timeout = 1200
timeout_method = thread